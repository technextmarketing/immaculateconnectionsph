name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # The pages load minified bundles. Rebuilding them here means a push that edited a
      # stylesheet or script but forgot `python tools/build.py` still ships the change.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build bundles
        run: |
          pip install --quiet rcssmin==1.2.2
          python tools/build.py assets
      # Publish only the public site. README, AUDIT, PRODUCT, tools/, _partials/ and .github/
      # stay in the repository and are never served.
      - name: Collect public files
        run: |
          rm -rf _site && mkdir _site
          cp *.html _site/
          cp robots.txt sitemap.xml llms.txt packages.md favicon.ico .nojekyll _site/
          cp -R assets _site/assets
          # stop the deploy if a page links to a local file that is not in _site
          missing=0
          for ref in $(grep -ohE '(href|src)="[^"#?]+' _site/*.html | sed -E 's/^(href|src)="//' | grep -vE '^(https?:|mailto:|tel:|data:|//)' | sort -u); do
            [ "$ref" = "./" ] && continue
            if [ ! -e "_site/$ref" ] && [ ! -e "_site/$ref.html" ]; then echo "missing: $ref"; missing=1; fi
          done
          [ "$missing" = 0 ]
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
